sample_sheet: "config/samples.tsv"

reference:
  fasta: "resources/reference/chr22.fa"

panel:
  full_template: "resources/panel/1000GP.{chrom}.noNA12878.bcf"

chromosomes:
  - "chr22"

genetic_map:
  template: "resources/maps/{chrom}.gmap"

# Test reads cover chr22 at ~1x only, so do not filter on depth.
bam_filter:
  min_depth: 0
  max_unmapped_frac: 0.8

fastp:
  extra: ""
