sample_sheet: "config/samples.tsv"

reference:
  fasta: "resources/reference/IRGSP-1.0_genome.fasta"

panel:
  full_template: "resources/ref_panel/311/{chrom}.vcf.gz"

chromosomes:
  - "chr01"
  - "chr02"
  - "chr03"
  - "chr04"
  - "chr05"
  - "chr06"
  - "chr07"
  - "chr08"
  - "chr09"
  - "chr10"
  - "chr11"
  - "chr12"

genetic_map:
  template: "resources/map/{chrom}.map"

bam_filter:
  min_depth: 1.0
  max_unmapped_frac: 0.8

phase:
  batch_size: 200

site_filter:
  min_info: 0.95

fastp:
  extra: ""
