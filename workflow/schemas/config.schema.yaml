$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
description: configuration schema for the rice imputation pipeline

properties:
  sample_sheet:
    type: string
    default: config/samples.tsv

  reference:
    type: object
    properties:
      fasta:
        type: string
        description: path to the reference genome FASTA
    required:
      - fasta

  panel:
    type: object
    properties:
      full_template:
        type: string
        description: per-chrom phased panel VCF/BCF template with .csi alongside, e.g. "reference/panel_{chrom}.bcf"
    required:
      - full_template

  chromosomes:
    type: array
    items:
      type: string
    minItems: 1
    description: chromosome names matching the reference and panel

  genetic_map:
    type: object
    properties:
      template:
        type: string
        description: per-chromosome genetic map path template, e.g. "maps/{chrom}.gmap"
    required:
      - template

  bam_filter:
    type: object
    properties:
      min_depth:
        type: number
        default: 1.0
        minimum: 0
        description: samples with mapped depth (after dedup) below this are dropped
      max_unmapped_frac:
        type: number
        default: 0.8
        minimum: 0
        maximum: 1
        description: samples with a fraction of unmapped reads above this are dropped

  phase:
    type: object
    properties:
      batch_size:
        type: integer
        default: 200
        minimum: 1
        description: maximum number of BAMs imputed in one GLIMPSE2_phase job

  site_filter:
    type: object
    properties:
      min_info:
        type: number
        default: 0.95
        minimum: 0
        maximum: 1
        description: sites with a recomputed IMPUTE INFO score below this are dropped from final.bcf

  fastp:
    type: object
    properties:
      extra:
        type: string
        default: ""

required:
  - sample_sheet
  - reference
  - panel
  - chromosomes
  - genetic_map
